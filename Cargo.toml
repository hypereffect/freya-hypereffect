[package]
name = "freya-hypereffect"
version = "0.2.2"
edition = "2024"
description = "A Freya renderer for hypereffect, drawn with Freya's own components and theme."
license = "MIT"
readme = "README.md"
documentation = "https://docs.rs/freya-hypereffect"
repository = "https://github.com/hypereffect/freya-hypereffect"
keywords = ["gui", "ui", "hypereffect", "freya"]
categories = ["gui"]

[dependencies]
freya = { version = "0.6.0-alpha", features = ["remote-asset"] }
freya-components = { version = "0.6.0-alpha.1", features = ["remote-asset"] }
hypereffect = "0.7.0"
serde = "1"
base64 = "0.22"
bytes = "1"

[dev-dependencies]
freya-testing = "0.6.0-alpha"
