name: Release

# Tag `vX.Y.Z` (or `vX.Y.Z-pre`) and the tag must match `version` in Cargo.toml.
on:
  push:
    tags:
      - "v[0-9]*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  build:
    name: Build, lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Freya is a path dependency for working next to a Freya checkout. There
      # is no checkout on the runner, so drop the path and build against the
      # published version: the one users of this crate get.
      - name: Build against the published freya
        run: |
          sed -i -E 's#^(freya = \{ )path = "[^"]+", #\1#' Cargo.toml
          grep -q '^freya = { version = ' Cargo.toml

      # Needed by the Skia bindings that Freya pulls in.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config cmake ninja-build clang python3 \
            libfontconfig1-dev libfreetype-dev libxkbcommon-dev \
            libwayland-dev libx11-dev libxcursor-dev libxrandr-dev \
            libxi-dev libgl1-mesa-dev libegl1-mesa-dev libudev-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release

      - name: Check the tag matches the crate version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match the Cargo.toml version '$version'"
            exit 1
          fi
          echo "Releasing freya-hypereffect $version"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets

  publish:
    name: Publish to crates.io
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      id-token: write # crates.io trusted publishing
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # release notes are generated from history
          persist-credentials: false

      - name: Build against the published freya
        run: |
          sed -i -E 's#^(freya = \{ )path = "[^"]+", #\1#' Cargo.toml
          grep -q '^freya = { version = ' Cargo.toml

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config cmake ninja-build clang python3 \
            libfontconfig1-dev libfreetype-dev libxkbcommon-dev \
            libwayland-dev libx11-dev libxcursor-dev libxrandr-dev \
            libxi-dev libgl1-mesa-dev libegl1-mesa-dev libudev-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release

      # Trusted publishing: crates.io hands out a short-lived token for this
      # workflow (configure it under the crate's "Trusted Publishing" settings).
      # If that is not set up, fall back to a CARGO_REGISTRY_TOKEN repository
      # secret holding a regular crates.io API token.
      - name: Get a crates.io token
        id: auth
        continue-on-error: true
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if curl -fsS -A "freya-hypereffect-release-workflow" \
            "https://crates.io/api/v1/crates/freya-hypereffect/$version" > /dev/null; then
            echo "freya-hypereffect $version is already on crates.io, nothing to do"
          else
            cargo publish
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
