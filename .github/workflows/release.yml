name: Release

on:
  push:
    tags:
      - "v[0-9]*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  build:
    name: Build, lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Needed by the Skia bindings that Freya pulls in.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config cmake ninja-build clang python3 \
            libfontconfig1-dev libfreetype-dev libxkbcommon-dev \
            libwayland-dev libx11-dev libxcursor-dev libxrandr-dev \
            libxi-dev libgl1-mesa-dev libegl1-mesa-dev libudev-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release

      - name: Check the tag matches the crate version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match the Cargo.toml version '$version'"
            exit 1
          fi
          echo "Releasing freya-hypereffect $version"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets

  publish:
    name: Publish to crates.io
    needs: build
    runs-on: ubuntu-latest
    # Must match the "Environment" field of the crate's trusted publisher
    # configuration on crates.io. Add protection rules (e.g. required
    # reviewers) to this environment if you want a human gate on releases.
    environment: release
    permissions:
      contents: write # create the GitHub release
      id-token: write # crates.io trusted publishing
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # release notes are generated from history
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config cmake ninja-build clang python3 \
            libfontconfig1-dev libfreetype-dev libxkbcommon-dev \
            libwayland-dev libx11-dev libxcursor-dev libxrandr-dev \
            libxi-dev libgl1-mesa-dev libegl1-mesa-dev libudev-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release

      # Trusted publishing: crates.io verifies this workflow's OIDC identity and
      # hands back a short-lived (30 min) token. There is no crates.io secret.
      #
      # One-time setup at https://crates.io/crates/freya-hypereffect/settings
      # ("Trusted Publishing" -> Add -> GitHub Actions):
      #   Owner:              hypereffect
      #   Repository:         freya-hypereffect
      #   Workflow filename:  release.yml
      #   Environment:        release
      # Renaming this workflow file breaks publishing until you update that config.
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if curl -fsS -A "freya-hypereffect-release-workflow" \
            "https://crates.io/api/v1/crates/freya-hypereffect/$version" > /dev/null; then
            echo "freya-hypereffect $version is already on crates.io, nothing to do"
          else
            cargo publish
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
